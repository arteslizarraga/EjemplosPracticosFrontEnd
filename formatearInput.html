<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Compatible con MDBootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Estructura Card (Idéntica en Bootstrap 5 y MDBootstrap) -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Formulario de Validación</h5>
                    </div>
                    <div class="card-body">

                        <form id="ejemploForm">

                            <div class="mb-3">
                                <label class="form-label">Input solo números</label>
                                <input type="text" class="form-control" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Formatear Número Entero</label>
                                <input name="txtNumeroEntero" type="text" class="form-control" oninput="this.value = formatearNumeroEntero(this.value)" maxlength="30" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Formatear Número Decimal</label>
                                <input name="txtNumeroDecimal" type="text" class="form-control" oninput="this.value = formatearNumeroDecimal(this.value)" maxlength="30" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Formatear Porcentaje</label>
                                <input type="text" class="form-control" oninput="this.value = formatearNumeroDecimal(this.value, 1)" maxlength="5" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Solo Mayúsculas</label>
                                <input type="text" name="nombre" class="form-control" maxlength="100"
                                oninput="let p = this.selectionStart; this.value = this.value.toUpperCase();this.setSelectionRange(p, p);" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Solo Números</label>
                                <input type="text" class="form-control" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" maxlength="3">
                            </div>

                        </form>

                    </div>
					<div class="card-footer">
						<button type="button" onclick="poblarConDatos()" class="btn btn-primary">Poblar con Datos</button>
						<button type="button" onclick="simularEnvio()" class="btn btn-secondary">Simular Envío</button>
					</div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        function formatearNumeroEntero(cadena)
		{
			// formatearNumeroEntero("123456789") -> "123.456.789"

			cadena = cadena.replace(/[^0-9]/g, '');                   // Remueve puntos, letras y cualquier otro caracter
			cadena = cadena.replace(/^0+(?=\d)/, '');                 // Remueve ceros a la izquierda ("000" -> "0", "0123" -> "123")

			return cadena.replace(/\B(?=(\d{3})+(?!\d))/g, '.');      // Agrega punto cada 3 digitos desde la derecha
		}

		function formatearNumeroDecimal(cadena, cantidadDecimales = 5)
		{
			// formatearNumeroDecimal("12345678,99") -> "12.345.678,99"

			if (!cadena.includes(",")) return formatearNumeroEntero(cadena);   // Si no se agrego la coma

			let partes = cadena.split(",");
			let cuerpoNumero = formatearNumeroEntero(partes[0]) || "0";       // ",5" -> "0,5"

			let decimales = partes.slice(1).join("")                           // Una segunda coma se ignora, no se pierden los decimales
				.replace(/[^0-9]/g, '')                                        // Limpia los decimales
				.substring(0, cantidadDecimales);                              // Limita la cantidad de decimales

			return `${cuerpoNumero},${decimales}`;
		}

		function limpiarNumeroEntero(numero) {
			return numero.replaceAll(".", "");
		}

		function limpiarNumeroDecimal(numero) {
			return numero.replaceAll(".", "").replaceAll(",", ".");
		}

		function poblarConDatos()
		{
			document.querySelector("#ejemploForm [name='txtNumeroEntero']").value = formatearNumeroEntero("123456789");
			document.querySelector("#ejemploForm [name='txtNumeroDecimal']").value = formatearNumeroDecimal("12345678,99");
		}

		function simularEnvio()
		{
			let numeroEntero = document.querySelector("#ejemploForm [name='txtNumeroEntero']").value;
			let numeroDecimal = document.querySelector("#ejemploForm [name='txtNumeroDecimal']").value;

			numeroEntero = limpiarNumeroEntero(numeroEntero);
			numeroDecimal = limpiarNumeroDecimal(numeroDecimal);

			console.log("numeroEntero", numeroEntero);
			console.log("numeroDecimal", numeroDecimal);
		}

    </script>

</body>

</html>
